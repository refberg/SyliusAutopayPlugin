name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        name: "GitHub release"

        steps:
            -
                uses: actions/checkout@v7

            -
                name: Create release from the changelog
                run: |
                    version="${GITHUB_REF_NAME#v}"
                    awk -v v="$version" '/^## /{if(p)exit; p=($2==v); next} p' CHANGELOG.md > notes.md
                    if [ ! -s notes.md ]; then
                        echo "::error::No section for ${version} in CHANGELOG.md"
                        exit 1
                    fi
                    gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file notes.md --verify-tag
                env:
                    GH_TOKEN: ${{ github.token }}
